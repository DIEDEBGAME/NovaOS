name: Compilar NovaOS 0.3.0

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias de compilación
        run: |
          apt-get update
          apt-get install -y git live-build debootstrap xorriso squashfs-tools sudo curl

      - name: Dar permisos de ejecución a los hooks
        run: chmod +x config/hooks/live/*

      - name: Ejecutar script de NovaOS
        run: |
          chmod +x scripts/build.sh
          cd scripts
          ./build.sh

      - name: Subir ISO como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-0.1.0-ISO
          path: scripts/build_iso/*.iso
